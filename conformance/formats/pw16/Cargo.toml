[package]
name = "conformance-pw16"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rkyv = { workspace = true, features = ["bytecheck", "indexmap-2", "pointer_width_16"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "0.23.0"
toml = "1"
