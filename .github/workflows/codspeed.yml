name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  codspeed:
    strategy:
      fail-fast: true
      matrix:
        test-file:
          - benchmark/codspeed-primitives-encode.ts
          - benchmark/codspeed-primitives-decode.ts
          - benchmark/codspeed-complex-encode.ts
          - benchmark/codspeed-complex-decode.ts
    name: Benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # CodSpeed action may not be compatible with the latest Node.js version yet.
          #
          # Exact pin: a floating `24` resolves to the newest 24.x at run time,
          # and V8 builtin changes between patch releases shift the simulated instruction counts.
          #
          # Baseline and PR must measure on the identical Node build.
          node-version: 24.18.0
          cache: yarn

      - name: Install Dependencies
        run: yarn install

      - name: Run benchmark
        # Exact pin: the floating major tag can swap the instrumented runner
        # (valgrind/instrument-hooks) between baseline and PR runs.
        uses: CodSpeedHQ/action@v4.18.5
        with:
          mode: simulation
          # Heap flags keep GC out of the measured windows.
          # The GC schedule is deterministic under the runner's `--predictable`,
          # but it follows the allocation history which every code change shifts,
          # so a GC cycle can land inside an arbitrary benchmark's single measured call
          # and inflate it ~10x (the tell: CodSpeed reports mmap/madvise syscalls inside a pure-compute benchmark).
          #
          # Static generous limits leave the plugin's pre-measurement `gc()`
          # with enough headroom that a window's few KB of allocation can never trigger a collection.
          run: >-
            node
            --initial-old-space-size=128
            --min-semi-space-size=16
            --max-semi-space-size=16
            --no-memory-reducer
            ${{ matrix.test-file }}
